[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hydroemu-mcp-server"
version = "0.2.0"
description = "MCP server exposing HACC cosmological hydrodynamic simulation emulators via cosmohydro_emu."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.27,<2",
    "pydantic>=2,<3",
    "numpy",
    "scipy<1.11",
    "matplotlib>=3.8",
    "cosmohydro_emu @ git+https://github.com/nesar/cosmohydro_emu.git",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.mcp-server]
tool_modules = ["tools"]

[tool.setuptools.packages.find]
where = ["."]
include = ["mcp_server*", "tools*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
